syntax = "proto3";

// Workforce Service — postings, and what the platform reads from them.
//
// # Called directly, authorized by the Kernel
//
// The same shape every platform service uses: the caller discovers this service
// and calls it over gRPC; this service asks the Kernel to authorize every RPC.
// The Kernel decides and this service enforces — no OpenFGA client here, and no
// cached decision. A cache in front of the revocation authority is how a
// disabled user keeps working for another ten seconds.
//
// # Slice 1 only
//
// Postings and their read surface. Shifts, leave, swaps, duty, attendance and
// capability are designed (chapter 01 §3) and belong to later slices; adding
// their RPCs now would ship a surface with nothing behind it.
//
// # What has no RPC, and why
//
// **No `CreateStaff`.** The person is Master Data's — ADR 0063 §Q5. This
// application posts people who already exist and can never create one, which is
// why Core Administration's Staff section is still where somebody is added.
//
// **No `GrantDepartmentAccess`.** A service never writes an authorization tuple
// (ADR 0061). `CreatePosting` announces, the Kernel's registration consumer
// materialises, and there is deliberately no vocabulary for OpenFGA here.
//
// **No `SetDepartmentHead`.** Headship is a *posting* attribute, not a separate
// operation on a department — ADR 0063's table. It is set where the posting is.

package hotelos.workforce.v1;

import "hotelos/common/v1/common.proto";
import "hotelos/workforce/v1/dto.proto";

option csharp_namespace = "HotelOS.Workforce.Contracts.V1";

service WorkforceService {
  rpc CreatePosting (CreatePostingRequest) returns (PostingView);
  rpc UpdatePosting (UpdatePostingRequest) returns (PostingView);

  // Close a posting's window. Not a delete: the row survives, because the rota
  // it covered was worked under it.
  rpc EndPosting (EndPostingRequest) returns (PostingView);

  rpc GetPosting   (GetPostingRequest)   returns (PostingView);
  rpc ListPostings (ListPostingsRequest) returns (ListPostingsResponse);
}

message CreatePostingRequest {
  hotelos.common.v1.RequestContext context = 1;

  string staff_id        = 2;
  string department_code = 3;
  string job_role        = 4;

  bool is_primary         = 5;
  bool is_department_head = 6;

  // Optional — most postings have none.
  string zone_id = 7;

  string reporting_manager_staff_id = 8;

  // ISO date. Required: a posting without a start cannot be placed in time, and
  // defaulting it to today would silently backdate an arrangement somebody
  // meant to begin next month.
  string effective_from = 9;
}

message UpdatePostingRequest {
  hotelos.common.v1.RequestContext context = 1;

  string id = 2;

  // Optimistic concurrency — two supervisors editing one posting is ordinary,
  // and the loser must be told rather than silently overwritten.
  int64 expected_version = 3;

  // Present-field patch semantics, per the platform's `PatchMask` convention.
  optional string job_role                   = 4;
  optional bool   is_primary                 = 5;
  optional bool   is_department_head         = 6;
  optional string zone_id                    = 7;
  optional string reporting_manager_staff_id = 8;

  // Deliberately absent: `staff_id` and `department_code`.
  //
  // Moving a posting to a different person or a different department is not an
  // edit — it is ending one posting and creating another, and the difference
  // matters because `department#posted` was announced for the old pair. An
  // update that quietly re-pointed it would leave a tuple granting access to a
  // department the person no longer works in.
}

message EndPostingRequest {
  hotelos.common.v1.RequestContext context = 1;

  string id               = 2;
  int64  expected_version = 3;

  // ISO date. The last day the posting is in force.
  string effective_to = 4;
}

message GetPostingRequest {
  hotelos.common.v1.RequestContext context = 1;
  string id = 2;
}

message ListPostingsRequest {
  hotelos.common.v1.RequestContext context = 1;

  // Filters. Empty means unfiltered.
  string staff_id        = 2;
  string department_code = 3;
  string zone_id         = 4;

  // Include postings whose window has closed. Default false: the ordinary
  // question is "who works here now".
  bool include_ended = 5;
}

message ListPostingsResponse {
  repeated PostingView postings = 1;
}
