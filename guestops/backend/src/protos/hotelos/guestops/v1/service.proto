syntax = "proto3";

// GuestOps Service — the front desk's surface.
//
// # Called directly, authorized by the Kernel
//
// The same shape every platform service uses: the caller discovers this service
// and calls it over gRPC; this service asks the Kernel to authorize every RPC.
// The Kernel decides and this service enforces — there is no OpenFGA client
// here and no cached decision.
//
// # Two modes, one surface
//
// GUEST-Q1: in a PMS-connected property the booking, check-in and check-out
// arrive through the Integration Hub, and **staff may still call every RPC
// here** — a write on a PMS-managed stay is recorded as an override. There is
// no second set of methods and no mode flag on a request: GUEST-Q4 removed the
// second mode rather than choosing a branch, so the surface is the same in both
// and only the meaning of a write differs.
//
// # What has no RPC, and why
//
// **No group operations.** No `CheckInBooking`, no `CancelBooking` — GUEST-Q2:
// every operation happens to a room-stay. Cancelling a booking is *n* calls to
// `CancelStay`, which is what the model does and what lets either stay be
// reinstated on its own.
//
// **No `SetBusinessDate`.** The boundary is Property Registration's
// configuration and the date is the Context Service's derivation — ADR 0128 §6,
// derived and stored by nobody.
//
// **No merge.** The person-graph is Guest360's (G360-Q1).
//
// **No folio.** GUEST-Q6 — Finance's later round.
package hotelos.guestops.v1;

import "hotelos/common/v1/common.proto";
import "hotelos/guestops/v1/dto.proto";

option csharp_namespace = "HotelOS.GuestOps.Contracts.V1";

service GuestOpsService {
  // --- the book ----------------------------------------------------------

  rpc CreateBooking (CreateBookingRequest) returns (Booking);
  rpc GetStay       (GetStayRequest)       returns (RoomStay);
  rpc ListStays     (ListStaysRequest)     returns (ListStaysResponse);

  // --- the stay's life ---------------------------------------------------

  // Give the stay a room, or move it to another.
  //
  // One RPC rather than two, because they are one operation on the model: the
  // open assignment closes and a new one opens. What differs is the `reason`,
  // and what the service publishes — `stay.assigned` for the first,
  // `stay.room_changed` for every later one (R8).
  rpc AssignRoom (AssignRoomRequest) returns (RoomStay);

  // Check in. **Refuses a stay with no room** — the one hard gate in this
  // application, and it is our own fact rather than a neighbour's (S8).
  //
  // It does *not* refuse a room Room Care has not released: an absent or
  // dissenting neighbour loses its capability, never this flow (APPS-Q2).
  rpc CheckIn (CheckInRequest) returns (RoomStay);

  rpc CheckOut (CheckOutRequest) returns (RoomStay);

  // Cancel one stay. The penalty is computed from the stored offset and
  // recorded; charging is Finance's.
  rpc CancelStay (CancelStayRequest) returns (RoomStay);

  // Record a no-show — a business fact, never a lifecycle verb.
  rpc RecordNoShow (RecordNoShowRequest) returns (RoomStay);

  // Move a stay's lifecycle backwards, deliberately and recorded.
  //
  // The guest checked out in error at 07:00 and still asleep in the room. The
  // one exception to the monotonic rule inbound facts obey, and it exists
  // because people are not monotonic.
  rpc CorrectStay (CorrectStayRequest) returns (RoomStay);

  // --- availability — GUEST-Q7 -------------------------------------------

  // What is sellable, computed from the stays this application holds plus the
  // facts it already hears. Never a stored table.
  rpc GetAvailability (GetAvailabilityRequest) returns (GetAvailabilityResponse);

  // --- the desk's own records -------------------------------------------
  //
  // Section 2.7. The card is an upsert rather than a create-then-update: it is
  // filled in over the length of a check-in — a name, then a document, then a
  // signature — so a create would make the desk's second keystroke an error.
  rpc CaptureRegistration (CaptureRegistrationRequest) returns (CapturedCard);
  rpc GetRegistration     (GetRegistrationRequest)     returns (CapturedCard);

  // Recording that a person filed with an authority. HotelOS submits nothing:
  // sending guest data outward is a connector's job, and this records the
  // receipt that is the property's evidence it complied.
  rpc RecordFiling      (RecordFilingRequest)      returns (StayReporting);
  rpc ListOutstandingFilings (ListOutstandingFilingsRequest)
      returns (ListOutstandingFilingsResponse);

  // GuestOps owns the request; Jobs owns the work.
  rpc LogRequest (LogRequestRequest) returns (StayRequest);
  rpc AddNote    (AddNoteRequest)    returns (StayNote);

  // This application's own configuration.
  rpc GetSettings  (GetSettingsRequest)  returns (GuestOpsSettings);
  rpc SaveSettings (SaveSettingsRequest) returns (GuestOpsSettings);
}

// -----------------------------------------------------------------------------
// Requests
// -----------------------------------------------------------------------------

// One stay to create, inside a booking.
//
// **No `room_id`.** A stay is anchored on the room *type*; the room is an
// assignment made later, and a create message that carried one would let a
// client express a stay whose assignment history began before the stay did.
message NewStay {
  string room_type_id = 1;

  // ISO-8601 dates. The service derives the timestamps from the property's
  // configured clock, in the property's zone, and marks them derived.
  string arrival_date = 2;
  string departure_date = 3;

  int32 adults = 4;
  int32 children = 5;

  // May be empty — *"not yet named"* is a valid party and is never filled with
  // a placeholder (R25).
  repeated NewGuest guests = 6;

  // How the guest arrived. Distinct from the source channel below.
  bool walk_in = 10;

  CommercialTerms terms = 20;
}

message NewGuest {
  string name_as_given = 1;
  string name_given = 2;
  string name_family = 3;

  // At most one of each kind is expected, and none is valid: a stay with no
  // contact detail is a real stay, and refusing it would lose one.
  string phone = 4;
  string email = 5;

  optional bool is_primary = 6;
}

message CreateBookingRequest {
  hotelos.common.v1.RequestContext context = 1;

  repeated NewStay stays = 2;

  // GUEST-Q7's kept set, as the desk knows it.
  string channel = 10;
  string travel_agent = 11;
  string market_code = 12;
  string meal_plan = 13;

  // How many stays this booking is expected to have, where that is known to be
  // more than the caller is sending — R9's incomplete group, expressible from
  // the desk as well as from a PMS.
  int32 expected_stay_count = 20;
}

message GetStayRequest {
  hotelos.common.v1.RequestContext context = 1;
  string stay_id = 2;
}

// The four lists the front desk works from.
enum StayView {
  STAY_VIEW_UNSPECIFIED = 0;

  // Due in on the business day.
  STAY_VIEW_ARRIVALS = 1;

  // Occupying a room now.
  STAY_VIEW_IN_HOUSE = 2;

  // Due out on the business day, and those already gone.
  STAY_VIEW_DEPARTURES = 3;

  // Disagreements, incomplete groups, unconfirmed candidate links, held facts.
  //
  // Not a defect log: every member is an ordinary condition of running a hotel
  // against a PMS feed.
  STAY_VIEW_ATTENTION = 4;
}

message ListStaysRequest {
  hotelos.common.v1.RequestContext context = 1;
  StayView view = 2;

  // The business day to list. Empty means today's, which the service asks the
  // Context Service for — it never computes one.
  string business_date = 3;

  // Paged, not cursored — CORE-Q13, ruled 2026-09-04. A business day's stays
  // are a bounded list whose count is a FACT: the desk expects "showing 1-25
  // of 47", and a cursor can express neither the ordinal nor the total. Tag 10
  // held `common.v1.PageRequest` and the screens could therefore draw only
  // Previous/Next.
  hotelos.common.v1.PagedRequest page = 11;

  reserved 10;
}

message ListStaysResponse {
  repeated RoomStay stays = 1;
  hotelos.common.v1.PagedResponse page = 4;
  hotelos.common.v1.ResponseMeta meta = 3;

  reserved 2;
}

message AssignRoomRequest {
  hotelos.common.v1.RequestContext context = 1;
  string stay_id = 2;
  string room_id = 3;

  // initial · move · upgrade · correction. An upgrade is an assignment: a
  // better room on unchanged terms leaves the booked type alone.
  string reason = 4;

  // The conflict check **warns and never forbids** — GUEST-Q5 made a
  // double-booked room a possible truth, so a hard block would put a ruled
  // outcome out of reach. This is the caller saying they saw the warning.
  bool accept_conflict = 5;

  int64 version = 10;
}

message CheckInRequest {
  hotelos.common.v1.RequestContext context = 1;
  string stay_id = 2;
  int64 version = 3;
}

message CheckOutRequest {
  hotelos.common.v1.RequestContext context = 1;
  string stay_id = 2;
  int64 version = 3;
}

message CancelStayRequest {
  hotelos.common.v1.RequestContext context = 1;
  string stay_id = 2;
  string reason = 3;
  int64 version = 4;
}

message RecordNoShowRequest {
  hotelos.common.v1.RequestContext context = 1;
  string stay_id = 2;
  int64 version = 3;
}

message CorrectStayRequest {
  hotelos.common.v1.RequestContext context = 1;
  string stay_id = 2;
  StayLifecycle to = 3;

  // Required. A correction that moves a stay backwards without a reason is
  // indistinguishable from a mistake six months later.
  string reason = 4;

  int64 version = 5;
}

message GetAvailabilityRequest {
  hotelos.common.v1.RequestContext context = 1;

  // ISO-8601 dates, inclusive.
  string from_date = 2;
  string to_date = 3;

  // Empty means every type the property has.
  repeated string room_type_ids = 4;
}

message GetAvailabilityResponse {
  repeated TypeAvailability availability = 1;
  hotelos.common.v1.ResponseMeta meta = 2;
}

// --- the desk's own records -----------------------------------------------

// The card as captured so far.
//
// Every field is optional and none is validated for presence here: what a card
// must carry is the PROPERTY's configuration, not the product's opinion. A
// required-ness baked into this message would be one jurisdiction's practice
// compiled into every property's build.
//
// What is deliberately absent is what a client may not set — the card number is
// minted from the property's series, the capturing user is the authenticated
// caller, and the signing moment is the server's clock. The message having
// nowhere to put them is stronger than validating them away.
message RegistrationEdit {
  string name_as_on_id = 1;
  string date_of_birth = 2;  // ISO-8601 date
  string nationality = 3;    // ISO 3166-1 alpha-2 — decides the visitor block
  string address_line = 4;
  string city = 5;
  string state = 6;
  string country = 7;
  string postal_code = 8;
  string id_type = 9;        // one of the property's configured types
  string id_number = 10;
  string id_issuer = 11;
  string id_expiry = 12;
  string arriving_from = 13;
  string proceeding_to = 14;
  string purpose_of_visit = 15;
  string vehicle_number = 16;

  // Filled when the guest's nationality is not the property's home country.
  string passport_number = 17;
  string passport_issue = 18;
  string passport_expiry = 19;
  string passport_place = 20;
  string visa_type = 21;
  string visa_number = 22;
  string visa_issue = 23;
  string visa_expiry = 24;
  string arrived_in_country_on = 25;
  string port_of_arrival = 26;

  // The platform's media references. Never blobs on this wire.
  string document_refs = 27;
  string signature_ref = 28;

  // Whether this capture completes the signature. The moment is the server's:
  // a client-supplied signing time on a legal-ish record is a value nobody can
  // corroborate.
  bool signed = 29;
}

// A stored card, and what it still lacks.
message CapturedCard {
  string stay_id = 1;
  string card_number = 2;
  RegistrationEdit card = 3;
  string signed_at = 4;
  string captured_by = 5;

  // Required field names carrying no value. Reported so a screen can prompt —
  // never a refusal, because an incomplete card must not turn a guest away.
  repeated string missing = 6;

  hotelos.common.v1.ResponseMeta meta = 7;
}

message CaptureRegistrationRequest {
  hotelos.common.v1.RequestContext context = 1;
  string stay_id = 2;
  RegistrationEdit card = 3;
}

message GetRegistrationRequest {
  hotelos.common.v1.RequestContext context = 1;
  string stay_id = 2;
}

// Where a stay's filing obligation has got to.
message StayReporting {
  string stay_id = 1;

  // Computed from the property's offset, never stored and reused — R18.
  // Empty when the arrival is unknown: an absence is not invented.
  string required_by = 2;

  string state = 3;  // needed · filed · not_required
  string filed_at = 4;
  string filed_by = 5;
  string authority = 6;

  // The authority's receipt — part of the record, not a log line.
  string reference = 7;

  hotelos.common.v1.ResponseMeta meta = 8;
}

message RecordFilingRequest {
  hotelos.common.v1.RequestContext context = 1;
  string stay_id = 2;
  string authority = 3;
  string reference = 4;
}

message ListOutstandingFilingsRequest {
  hotelos.common.v1.RequestContext context = 1;

  // The day to judge overdue against. ISO-8601.
  string as_of = 2;
}

message ListOutstandingFilingsResponse {
  repeated StayReporting filings = 1;
  hotelos.common.v1.ResponseMeta meta = 2;
}

// Something the guest asked for.
message StayRequest {
  string id = 1;
  string stay_id = 2;
  string text = 3;
  string logged_by = 4;
  string logged_at = 5;
  bool handed_off = 6;

  // The job Jobs created, learned from its reply — EVT-Q3. Empty means no job
  // yet, which is also what an uninstalled Jobs looks like (APPS-Q2).
  string job_id = 7;

  hotelos.common.v1.ResponseMeta meta = 8;
}

message LogRequestRequest {
  hotelos.common.v1.RequestContext context = 1;
  string stay_id = 2;
  string text = 3;

  // Whether to announce it for another application to act on. Not every
  // request becomes work — a late checkout is answered at the desk.
  bool hand_off = 4;
}

// A remark about this stay, which dies with it.
message StayNote {
  string id = 1;
  string stay_id = 2;
  string text = 3;
  string author = 4;
  string at = 5;
  hotelos.common.v1.ResponseMeta meta = 6;
}

message AddNoteRequest {
  hotelos.common.v1.RequestContext context = 1;
  string stay_id = 2;
  string text = 3;
}

// This application's own configuration, per property.
//
// Nothing here names a country: "from outside" is nationality != home_country,
// so a hotel in Kochi and a hotel in Dubai run the same build.
message GuestOpsSettings {
  string property_id = 1;
  string home_country = 2;

  // Two sets, not one set plus a rule: a property that asks a passport of
  // everyone and one that asks it of visitors only are both ordinary.
  repeated string required_for_home_country = 3;
  repeated string required_for_visitors = 4;

  repeated string accepted_id_types = 5;
  bool signature_required = 6;
  bool print_on_check_in = 7;
  string card_number_prefix = 8;

  bool reporting_required = 9;
  string reporting_applies_to = 10;  // from_outside · every_guest
  string reporting_authority = 11;

  // The deadline as hours after arrival — an offset survives the arrival
  // moving, and a stored date does not (R18).
  int32 reporting_due_hours = 12;

  int64 version = 13;
  hotelos.common.v1.ResponseMeta meta = 14;
}

message GetSettingsRequest {
  hotelos.common.v1.RequestContext context = 1;
}

// The next card number is deliberately absent: a property that could set the
// counter backwards would issue one number twice, and two guests signing one
// number is the records defect the unique index exists to prevent.
message SaveSettingsRequest {
  hotelos.common.v1.RequestContext context = 1;
  string home_country = 2;
  repeated string required_for_home_country = 3;
  repeated string required_for_visitors = 4;
  repeated string accepted_id_types = 5;
  bool signature_required = 6;
  bool print_on_check_in = 7;
  string card_number_prefix = 8;
  bool reporting_required = 9;
  string reporting_applies_to = 10;
  string reporting_authority = 11;
  int32 reporting_due_hours = 12;
  int64 version = 13;
}
