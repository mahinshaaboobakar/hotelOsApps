<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>GuestOps module realm</title>
<link rel="stylesheet" href="./tokens.css">
<style>
  /*
   * The base rules the real realm writes into a module's document, mirrored
   * from `apps/desktop/src/shell/module-host/realm.ts` (rootStyle) as it stands
   * after SHELL-Q33: the ROOT paints, using published names, and the body is
   * transparent so the root's paint shows through rather than offering a second
   * opinion one rule below the one that has it.
   *
   * Mirrored rather than approximated, because a harness that painted its own
   * background would hide exactly the defect that ruling closed.
   */
  :root { background: var(--color-surface); color: var(--color-ink); }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: transparent; color: inherit; }
  * { scrollbar-width: thin; scrollbar-color: var(--color-ink-faint) transparent; }
</style>
</head><body><script type="module" src="./frame.js"></script></body></html>
